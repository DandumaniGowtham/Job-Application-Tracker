[project]
name = "job-application-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DandumaniGowtham", email = "gowthamdandumani777@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.4",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "ruff>=0.16.10",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.54.0",
]

[project.scripts]
job-application-tracker = "job_application_tracker:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
